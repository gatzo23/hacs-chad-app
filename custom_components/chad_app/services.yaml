# Service definitions for Chad App / Adlos Integration

send_message:
  name: Send message via Adlos
  description: Sends a notification text message or photo/camera image to the Adlos App.
  fields:
    message:
      name: Message / Text
      description: The main message text to send.
      required: true
      example: "Die Waschmaschine ist fertig!"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title for the notification.
      required: false
      example: "Haushalt"
      selector:
        text:
    image:
      name: Image / Photo Path
      description: Optional local path to an image file (e.g. /config/www/snapshot.jpg).
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text:
    target:
      name: Target / Recipient(s)
      description: Optional contact ID, list of contact IDs, or room name. If omitted, sends to all configured target contacts.
      required: false
      example: "user_contact_id_1, user_contact_id_2"
      selector:
        text:
    encryption_key:
      name: Encryption Key
      description: Optional custom Base64/passphrase encryption key override.
      required: false
      example: "adlos_custom_secret"
      selector:
        text:
    data:
      name: Extra Data
      description: Additional key-value options if needed.
      required: false
      selector:
        object:

send_photo:
  name: Send message via Adlos
  description: Sends a notification message or photo image file to one or multiple Adlos users.
  fields:
    message:
      name: Caption / Text
      description: Optional text message or caption for the photo.
      required: false
      example: "Bewegung an der Auffahrt"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title for the photo.
      required: false
      example: "Kamera Auffahrt"
      selector:
        text:
    path:
      name: Image File Path
      description: Optional local path to the image file on Home Assistant (e.g. /config/www/snapshot.jpg).
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text:
    image:
      name: Image / Photo Path
      description: Optional alternative field for the local image file path.
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text:
    target:
      name: Target / Recipient(s)
      description: Optional contact ID, list of contact IDs, or room name. If omitted, sends to all configured target contacts.
      required: false
      example: "user_contact_id_1, user_contact_id_2"
      selector:
        text:
    encryption_key:
      name: Encryption Key
      description: Optional custom Base64/passphrase encryption key override.
      required: false
      example: "adlos_custom_secret"
      selector:
        text:

register_user:
  name: Register User Contact
  description: Registers a user contact ID for multi-user notifications (e.g. called automatically upon QR code scan).
  fields:
    contact_id:
      name: Contact ID
      description: The Adlos contact ID of the user.
      required: true
      example: "a1b2c3d4e5f6789"
      selector:
        text:
    name:
      name: User Name
      description: Optional display name for the user.
      required: false
      example: "Kai"
      selector:
        text:

unregister_user:
  name: Unregister User Contact
  description: Removes a user contact ID from the registered target contacts.
  fields:
    contact_id:
      name: Contact ID
      description: The Adlos contact ID to remove.
      required: true
      example: "a1b2c3d4e5f6789"
      selector:
        text:



