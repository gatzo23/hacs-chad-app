# Service definitions for Adlos Integration

send_message:
  name: Send message via Adlos
  description: Sends an end-to-end encrypted notification text message or camera snapshot to paired Adlos users.
  fields:
    message:
      name: Message / Text
      description: The main message text to send.
      required: true
      example: "Die Waschmaschine ist fertig! 🧺"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title for the notification.
      required: false
      example: "Haushalt"
      selector:
        text: {}
    target:
      name: Target / Recipient(s)
      description: "Optional recipient(s). Can be a paired user name (e.g. 'Kai'), a 15-character PocketBase contact ID, or a room name prefixed with 'room:'. If omitted, sends to all paired users."
      required: false
      example: "Kai"
      selector:
        text: {}
    camera:
      name: Camera Entity
      description: "Optional camera entity (e.g. camera.haustuer) for automatic live snapshot delivery."
      required: false
      example: "camera.haustuer"
      selector:
        entity:
          domain: camera
    image:
      name: Image / Photo Path or URL
      description: "Optional local path (/config/www/snapshot.jpg) or image URL."
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text: {}
    encryption_key:
      name: Encryption Key
      description: Optional custom AES encryption key override.
      required: false
      example: "adlos_custom_secret"
      selector:
        text: {}

send_photo:
  name: Send photo via Adlos
  description: Sends an end-to-end encrypted photo image file to paired Adlos users.
  fields:
    message:
      name: Caption / Text
      description: Optional text message or caption for the photo.
      required: false
      example: "Bewegung an der Haustür"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title for the photo.
      required: false
      example: "Kamera Haustür"
      selector:
        text: {}
    camera:
      name: Camera Entity
      description: "Optional camera entity (e.g. camera.haustuer) for snapshot delivery."
      required: false
      example: "camera.haustuer"
      selector:
        entity:
          domain: camera
    path:
      name: Image File Path
      description: Optional local path to the image file on Home Assistant (e.g. /config/www/snapshot.jpg).
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text: {}
    image:
      name: Image / Photo Path or URL
      description: "Optional alternative field for local image file path or URL."
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text: {}
    target:
      name: Target / Recipient(s)
      description: "Optional recipient(s). If omitted, sends to all paired contacts."
      required: false
      example: "Kai"
      selector:
        text: {}

register_user:
  name: Register User Contact
  description: Manually registers an Adlos contact ID and display name.
  fields:
    contact_id:
      name: Contact ID
      description: The 15-character Adlos contact ID of the user.
      required: true
      example: "a1b2c3d4e5f6789"
      selector:
        text: {}
    name:
      name: User Name
      description: "Optional display name for the user."
      required: false
      example: "Kai"
      selector:
        text: {}
    room_key:
      name: Room Key (E2EE)
      description: "Optional Base64 AES encryption key for E2EE."
      required: false
      selector:
        text: {}

unregister_user:
  name: Unregister User Contact
  description: Removes an Adlos contact ID from the paired user list.
  fields:
    contact_id:
      name: Contact ID
      description: The Adlos contact ID to remove.
      required: true
      example: "a1b2c3d4e5f6789"
      selector:
        text: {}
