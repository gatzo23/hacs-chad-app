# Service definitions for Chad App / Adlos Integration

send_message:
  name: Send message via Adlos
  description: Sends an end-to-end encrypted notification text message or photo to Adlos users, registered contacts, or specific rooms.
  fields:
    message:
      name: Message / Text
      description: The main message text to send.
      required: true
      example: "Die Waschmaschine ist fertig!"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title for the notification.
      required: false
      example: "Haushalt"
      selector:
        text: {}
    target:
      name: Target / Recipient(s)
      description: "Optional recipient(s). Can be a registered user name (e.g. 'Kai'), a list of names/IDs (e.g. ['Kai', 'Eltern']), a 15-character PocketBase contact ID, or a room name prefixed with 'room:' (e.g. 'room:homeassistant_bot'). If omitted, sends to all configured target contacts or 'homeassistant_bot'."
      required: false
      example: "Kai"
      selector:
        text: {}
    room:
      name: Room Override
      description: "Optional explicit room override. By default, 'homeassistant_bot' is used."
      required: false
      example: "homeassistant_bot"
      selector:
        text: {}
    image:
      name: Image / Photo Path
      description: Optional local path to an image file (e.g. /config/www/snapshot.jpg).
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text: {}
    encryption_key:
      name: Encryption Key
      description: Optional custom Base64/passphrase encryption key override.
      required: false
      example: "adlos_custom_secret"
      selector:
        text: {}

send_photo:
  name: Send photo via Adlos
  description: Sends an end-to-end encrypted photo image file to one or multiple Adlos users, registered contacts, or rooms.
  fields:
    message:
      name: Caption / Text
      description: Optional text message or caption for the photo.
      required: false
      example: "Bewegung an der Auffahrt"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title for the photo.
      required: false
      example: "Kamera Auffahrt"
      selector:
        text: {}
    path:
      name: Image File Path
      description: Optional local path to the image file on Home Assistant (e.g. /config/www/snapshot.jpg).
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text: {}
    image:
      name: Image / Photo Path
      description: Optional alternative field for the local image file path.
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text: {}
    target:
      name: Target / Recipient(s)
      description: "Optional recipient(s). Can be a registered user name (e.g. 'Kai'), a list of names/IDs (e.g. ['Kai', 'Eltern']), a 15-character contact ID, or a room prefixed with 'room:'. If omitted, sends to all configured contacts."
      required: false
      example: "Kai"
      selector:
        text: {}
    room:
      name: Room Override
      description: "Optional explicit room override. By default, 'homeassistant_bot' is used."
      required: false
      example: "homeassistant_bot"
      selector:
        text: {}
    encryption_key:
      name: Encryption Key
      description: Optional custom Base64/passphrase encryption key override.
      required: false
      example: "adlos_custom_secret"
      selector:
        text: {}

register_user:
  name: Register User Contact
  description: Registers a user contact ID and display name for multi-user notifications and target resolution (e.g. called automatically upon QR code scan).
  fields:
    contact_id:
      name: Contact ID
      description: The 15-character Adlos contact ID of the user.
      required: true
      example: "a1b2c3d4e5f6789"
      selector:
        text: {}
    name:
      name: User Name
      description: "Optional display name for the user (allows addressing the user via target: 'Name')."
      required: false
      example: "Kai"
      selector:
        text: {}

unregister_user:
  name: Unregister User Contact
  description: Removes a user contact ID from the registered target contacts and user list.
  fields:
    contact_id:
      name: Contact ID
      description: The Adlos contact ID to remove.
      required: true
      example: "a1b2c3d4e5f6789"
      selector:
        text: {}



