# Service definitions for Chad App / Adlos Integration

send_message:
  name: Send message via Adlos
  description: Sends a notification text message or photo/camera image to the Adlos App.
  fields:
    message:
      name: Message / Text
      description: The main message text to send.
      required: true
      example: "Die Waschmaschine ist fertig!"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title for the notification.
      required: false
      example: "Haushalt"
      selector:
        text:
    image:
      name: Image / Photo Path
      description: Optional local path to an image file (e.g. /config/www/snapshot.jpg).
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text:
    target:
      name: Target / Recipient (Room)
      description: Optional recipient or room name (e.g. homeassistant_bot).
      required: false
      example: "homeassistant_bot"
      selector:
        text:
    data:
      name: Extra Data
      description: Additional key-value options if needed.
      required: false
      selector:
        object:

send_photo:
  name: Send photo via Adlos
  description: Sends a photo image file with an optional message/caption to the Adlos App.
  fields:
    message:
      name: Caption / Text
      description: Optional text message or caption for the photo.
      required: false
      example: "Bewegung an der Auffahrt"
      selector:
        text:
          multiline: true
    title:
      name: Title
      description: Optional title for the photo.
      required: false
      example: "Kamera Auffahrt"
      selector:
        text:
    path:
      name: Image File Path
      description: Local path to the image file on Home Assistant (e.g. /config/www/snapshot.jpg).
      required: true
      example: "/config/www/snapshot.jpg"
      selector:
        text:
    target:
      name: Target / Recipient (Room)
      description: Optional recipient or room name (e.g. homeassistant_bot).
      required: false
      example: "homeassistant_bot"
      selector:
        text:
